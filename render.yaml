services:
  - type: web
    name: style-zone
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: style-zone-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
