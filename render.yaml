services:
  - type: web
    name: style-zone
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # NOTE: free plan has no persistent disk — the database and any admin-uploaded
    # photos reset to the seeded catalog on every restart/redeploy. Add a `disk:`
    # block back (see git history) and switch `plan` to `starter` once ready to
    # pay for storage that survives restarts.
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
